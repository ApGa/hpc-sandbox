name: Release

# Builds the sdist and the wheel and checks them on every pull request; on a pushed v* tag,
# publishes them to PyPI with trusted publishing, from the `pypi` environment (CONTRIBUTING.md,
# "Release a version"). Since this workflow can publish, its actions are pinned to commits (the
# release in the comment next to each), it caches nothing, and the checkout keeps no credentials for
# the build backend to read.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
        with:
          enable-cache: false

      - name: Build the sdist and the wheel
        run: uv build --no-sources

      - name: Check the metadata and the PyPI description
        run: uvx twine check --strict dist/*

      - name: Run the wheel in a fresh environment
        run: uvx --from dist/*.whl hpc-sandbox --version

      - name: Check that the tag names the version in pyproject.toml
        if: github.ref_type == 'tag'
        run: test -f "dist/hpc_sandbox-${GITHUB_REF_NAME#v}-py3-none-any.whl"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    # Only a pushed tag publishes; a manual run on a tag only builds.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for hpc-sandbox names this repository, this workflow file and this
    # environment.
    environment:
      name: pypi
      url: https://pypi.org/project/hpc-sandbox/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
