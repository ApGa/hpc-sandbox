name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  # The unit tests, with the fake runtimes of tests/ (CONTRIBUTING.md, "Run the tests"). The
  # integration tests need a container runtime on a compute node, and skip here.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor. The tests of the enroot
      # provider and of pods, and those that mount file systems in a namespace, would skip.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check that unprivileged user namespaces work
        run: unshare --user --map-root-user --mount --pid --ipc --net --fork true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -v -ra

  # The gVisor provider against a real runsc (tests/test_gvisor_integration.py, its services in pods
  # in tests/test_gvisor_pods_integration.py, go-judge among them, and the integration tests of
  # every provider), twice: with SIF images, which Apptainer pulls, in Apptainer pods; and on a
  # runner without Singularity, with the squashfs images that enroot imports, in enroot pods, as on
  # clusters that have only enroot. The provider picks its images by what it finds, and doctor says
  # which. runsc, Apptainer, enroot and go-judge come from their releases, checked against the
  # checksums pinned here; the runsc release is the one the provider was measured with.
  # tests/test_gvisor.py and tests/test_gvisor_pods.py run in the test job.
  gvisor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        images: [sif, enroot]
    env:
      GVISOR_RELEASE: "20261026.0"
      GVISOR_SHA512: 26e4a327565f5da0f73261a6387e2c20f4695a232e330095a3111b70efd604fdf09d734e8cc8f714dbb5c5607ce8c87ea80b26df549d83a146f2efd5a1af448a
      APPTAINER_VERSION: "1.5.5"
      APPTAINER_SHA256: 25095d3711504b3e8657dbb2e172ef8db9db43c4503d940c9c36b105db8dce77
      ENROOT_VERSION: "4.2.1"
      ENROOT_SHA256: 5955c51e88df0c5ed538d87abb5264609d4bad55fa8570745ed5d4ec66c8ab91
      ENROOT_CAPS_SHA256: ca22652dcbdd3ebb6e2c68df781ef4301647c79dd7a41ed62899c2fd0f692750
      GOJUDGE_VERSION: "1.11.1"
      GOJUDGE_SHA256: ffb8828f6097b2cc70adfab6781a372f5f58ba77ca06cf22bbfbb6a17c7a2e65
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      # Rootless runsc makes a user namespace, which Ubuntu 24.04 restricts with AppArmor.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # gvisor.tar holds runsc and the gvisor-bin/ helpers it needs beside it. The published
      # SHA-512 must match, and so must the one pinned above.
      - name: Install runsc
        run: |
          directory="$RUNNER_TEMP/gvisor"
          url="https://storage.googleapis.com/gvisor/releases/release/$GVISOR_RELEASE/x86_64"
          mkdir -p "$directory"
          cd "$directory"
          curl -fsSL -o gvisor.tar.bz2 "$url/gvisor.tar.bz2"
          curl -fsSL -o gvisor.tar.bz2.sha512 "$url/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          echo "$GVISOR_SHA512  gvisor.tar.bz2" | sha512sum -c -
          tar -xjf gvisor.tar.bz2
          echo "$directory" >> "$GITHUB_PATH"

      - name: Install Apptainer
        if: matrix.images == 'sif'
        run: |
          deb="apptainer_${APPTAINER_VERSION}_amd64.deb"
          url="https://github.com/apptainer/apptainer/releases/download/v$APPTAINER_VERSION/$deb"
          curl -fsSL -o "$RUNNER_TEMP/$deb" "$url"
          echo "$APPTAINER_SHA256  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo apt-get update -q
          sudo apt-get install -y -q "$RUNNER_TEMP/$deb"

      # enroot and its +caps package, which gives enroot-aufs2ovlfs and enroot-mksquashovlfs the
      # file capabilities that imports need; the SHA-256s are those the release publishes. enroot
      # itself first runs in doctor, below, with its directories as hpc-sandbox sets them.
      - name: Install enroot
        if: matrix.images == 'enroot'
        run: |
          url="https://github.com/NVIDIA/enroot/releases/download/v$ENROOT_VERSION"
          enroot="enroot_${ENROOT_VERSION}-1_amd64.deb"
          caps="enroot+caps_${ENROOT_VERSION}-1_amd64.deb"
          curl -fsSL -o "$RUNNER_TEMP/$enroot" "$url/$enroot"
          curl -fsSL -o "$RUNNER_TEMP/$caps" "$url/${caps/+/%2B}"
          echo "$ENROOT_SHA256  $RUNNER_TEMP/$enroot" | sha256sum -c -
          echo "$ENROOT_CAPS_SHA256  $RUNNER_TEMP/$caps" | sha256sum -c -
          sudo apt-get update -q
          sudo apt-get install -y -q "$RUNNER_TEMP/$enroot" "$RUNNER_TEMP/$caps"
          dpkg-query --show enroot enroot+caps

      # The release archive holds the go-judge binary that the go-judge test binds into a service.
      - name: Install go-judge
        run: |
          archive="go-judge_${GOJUDGE_VERSION}_linux_amd64v2.tar.gz"
          url="https://github.com/criyle/go-judge/releases/download/v$GOJUDGE_VERSION/$archive"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$url"
          echo "$GOJUDGE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/go-judge"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/go-judge"

      - name: Check that rootless runsc runs
        run: |
          runsc --version
          runsc --rootless --network=none --root "$RUNNER_TEMP/runsc-state" do true

      - name: Install dependencies
        run: uv sync --group dev

      # Starts a sandbox with runsc run, as the provider does, beyond runsc do, from the images it
      # picks: SIF images with Apptainer, enroot's without.
      - name: Check the node with doctor
        env:
          EXPECTED: ${{ matrix.images == 'enroot' && 'squashfs images' || 'SIF images' }}
        run: |
          set -o pipefail
          uv run hpc-sandbox doctor --runtime gvisor --image docker://alpine:3.20 \
            | tee "$RUNNER_TEMP/doctor.txt"
          grep -q "^\[  ok\] images: $EXPECTED" "$RUNNER_TEMP/doctor.txt"

      - name: Run the integration tests with gVisor
        env:
          HPC_SANDBOX_INTEGRATION: "1"
          HPC_SANDBOX_TEST_RUNTIME: gvisor
          HPC_SANDBOX_TEST_GOJUDGE: ${{ runner.temp }}/go-judge
        run: >-
          uv run pytest tests/test_gvisor_integration.py tests/test_gvisor_pods_integration.py
          tests/test_integration.py -v -ra
