default_install_hook_types: [pre-commit, commit-msg]
# Hooks without stages of their own run before a commit (and in CI's `pre-commit run --all-files`),
# not again when the commit message is checked.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # The ruff that the dev group in pyproject.toml pins: upgrade both in the same commit
    # (CONTRIBUTING.md, "Lint and format").
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/compilerla/conventional-pre-commit
    # Keep v4.0.0 (see CONTRIBUTING.md): later releases accept any message that starts with
    # "Merge", and a type in any case ("Feat:"), which the pull request title check rejects.
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        args: [--verbose]  # a rejection lists the accepted types and what the message is missing
        stages: [commit-msg]
